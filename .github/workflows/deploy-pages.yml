name: deploy-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "publishers/**"
      - "extensions/**"
      - "advisories/**"
      - "schemas/**"
      - "scripts/**"
      - "package*.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require Registry signing key
        shell: bash
        env:
          NOWEN_REGISTRY_SIGNING_PRIVATE_KEY: ${{ secrets.NOWEN_REGISTRY_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$NOWEN_REGISTRY_SIGNING_PRIVATE_KEY" ]]; then
            echo "NOWEN_REGISTRY_SIGNING_PRIVATE_KEY repository secret is required" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run verify:artifacts
      - run: npm run build
      - run: npm run sign
        env:
          NOWEN_REGISTRY_SIGNING_PRIVATE_KEY: ${{ secrets.NOWEN_REGISTRY_SIGNING_PRIVATE_KEY }}
      - run: npm run verify:dist
      - run: cp -R schemas dist/schemas
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
