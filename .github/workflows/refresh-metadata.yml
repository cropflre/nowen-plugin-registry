name: refresh-metadata

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:bump
      - run: npm run check
      - name: Open signed metadata refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/refresh-registry-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add registry/release.json
          git commit -m "chore(registry): refresh signed metadata window"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "chore(registry): refresh signed metadata window" \
            --body "Automated monthly sequence and expiry refresh. Merge after required Registry validation succeeds." \
            --base main \
            --head "$branch"
